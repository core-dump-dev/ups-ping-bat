# ============================================================
# UPS Shutdown Configuration
# ============================================================
# Edit values below, save, then restart the monitor.
# All settings live HERE — nothing is hardcoded in the .ps1 file.
# ============================================================

# Shutdown mode (1-8):
#   1 = Shutdown after 1 min on battery
#   2 = Shutdown after 5 min on battery
#   3 = Shutdown after 10 min on battery
#   4 = Shutdown after 30 min on battery
#   5 = Shutdown at 50% battery charge
#   6 = Shutdown at 25% battery charge
#   7 = Shutdown at 10% battery charge
#   8 = Shutdown at 5% battery charge
MODE=5

# Seconds shown on the dialog before auto-shutdown
DIALOG_TIMEOUT_SEC=60

# Minutes added when user clicks "Postpone"
POSTPONE_MINUTES=5

# Seconds Windows shows its own countdown before actually shutting down
SHUTDOWN_GRACE_SEC=10

# How often to poll the UPS (seconds)
POLL_INTERVAL=5

# ============================================================
# NUT server
# ============================================================
NUT_HOST=192.168.0.15
NUT_PORT=3493
UPS_NAME=ups

# ============================================================
# Web UI
# ============================================================
# WEB_HOST options:
#   localhost   = only this PC
#   +           = all interfaces (LAN access, needs urlacl as admin)
WEB_PORT=9921
WEB_HOST=+
WEB_REFRESH=5

# ============================================================
# Logging
# ============================================================
ONLINE_LOG_INTERVAL=3600
EVENT_LOG_INTERVAL=5
MAX_FILE_SIZE_MB=1
MAX_TOTAL_SIZE_MB=10

# ============================================================
# AVR logging
# ============================================================
# Tolerance in volts: if |Out - In| > this value, it's Boost/Trim, else Normal
AVR_TOLERANCE_V=3
AVR_LOG_FILE=ups_avr.txt